server:
  port: 8082

spring:
  application:
    name: listing-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://admin:password@localhost:27017/listings?authSource=admin}
      auto-index-creation: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:rental-app-secret-key-must-be-at-least-32-characters-long}

app:
  upload-dir: ${UPLOAD_DIR:/app/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health,info
